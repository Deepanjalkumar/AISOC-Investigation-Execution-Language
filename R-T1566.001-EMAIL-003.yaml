# Grounded in email-t12: subject advertises a password-protected confidential
# document; the archive's decryption password is supplied IN CLEARTEXT in the message
# body -- meaning the recipient can open it but a gateway/AV scanner, which cannot
# read the body's password out-of-band, cannot inspect the archive's actual contents.
# Real cold-agent confidence 0.60 (lower -- the archive's actual payload could not be
# inspected, an honest real limitation, not a strong positive signal on its own).
rule_id: R-T1566.001-EMAIL-003
version: 1
technique_id: T1566.001
tactic: initial-access
hypothesis_label: "Password-protected archive with the password supplied in-body, defeating gateway inspection"
status: candidate
severity_ceiling: 7
base_confidence: 0.30
calibration: { method: untuned }

same_entity: [message_id]

required_signatures:
  - sig_id: s1
    sensor: email
    match: { attachment_type: encrypted_archive, archive_password_present_in_body: true }
    independence_group: g_evasion

disconfirming_signatures:
  - sig_id: d1
    source: context_store
    match: { asset_ou_in: [SecurityTeam, RedTeam, PentestLab] }
    effect: suppress
    rationale: "Sanctioned archive-evasion test."
  - sig_id: d2
    source: email
    match: { sender_has_prior_legitimate_encrypted_exchange_history: true }
    effect: penalize
    confidence_penalty: 0.20
    rationale: "This sender has a documented history of legitimately exchanging password-protected documents with this organization (e.g. a law firm or auditor)."

required_qualifiers:
  - qualifier_id: q1
    question: "What does the archive actually contain, once opened with the supplied password in a sandbox?"
    resolve_via: edr_process_access_telemetry
    refutes_if: "the archive contains a benign document with no executable or macro content"
  - qualifier_id: q2
    question: "Is there a plausible, verifiable business relationship justifying encrypted document exchange with this sender?"
    resolve_via: context_store
    weakens_if: "a documented business relationship exists"

chain_role: entry
# Only two hops are declared, deliberately. The whole premise of this rule is that the
# archive's contents were NEVER inspected (the gateway couldn't, and neither could the
# cold agent -- see this file's header comment). Manual extract-and-run (execution) and the
# resulting egress (command-and-control) are implied by the delivery mechanism itself and
# hold for any payload; anything past that -- persistence, collection, impact -- would be a
# claim about a payload nobody in this chain has actually seen.
expects_downstream:
  - tactic: execution
    within: PT2H
  - tactic: command-and-control
    within: PT4H
references:
  - https://attack.mitre.org/techniques/T1566/001/
owner: email-detection-eng

# 2026-08-08: recursive_logic added, same bounded-follow-up discipline as
# rule_engine/rules/R-T1566-T1059-001.yaml (the other entry-role phishing rule).
recursive_logic:
  enabled: true
  spawn_on: auto
  max_depth: 1
  max_spawned_investigations: 2
  rationale: >
    This rule fires on an evasion, not on an observed payload -- the in-body password lets
    the recipient open an archive the scanning gateway provably could not, so the message
    evidence caps out at "something uninspected was delivered" and this rule's own base
    confidence (0.30) reflects that. The follow-up hop is what closes that gap: did anyone
    actually type the password, extract, and run the contents (execution -- allowing a
    couple of hours for the manual extraction steps this lure requires, which is slower
    than a one-click link), and did whatever ran then reach out (command-and-control,
    within four hours of the run). Stopping at two hops is the honest bound here rather
    than a cost bound: further-downstream tactics would require knowing the payload.
    chain_role=entry so spawn_on=auto resolves to downstream-only (see
    recursive_planner/planner.py's _auto_direction()). Depth 1 and exactly the 2 declared
    candidates, per specs/07 §9.
