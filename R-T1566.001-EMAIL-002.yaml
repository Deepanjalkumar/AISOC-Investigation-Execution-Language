# Grounded in email-t11: subject uses security/portal urgency framing; body instructs
# opening an attached HTML file and clicking a button inside it; the attachment's
# filename declares .html but its declared MIME content-type is a generic binary
# stream -- a real type/extension mismatch that both evades attachment-type filtering
# and forces a manual open. Real cold-agent confidence 0.74.
rule_id: R-T1566.001-EMAIL-002
version: 1
technique_id: T1566.001
tactic: initial-access
hypothesis_label: "HTML-smuggling attachment with a declared-type/extension mismatch"
status: candidate
severity_ceiling: 8
base_confidence: 0.35
calibration: { method: untuned }

same_entity: [message_id]

required_signatures:
  - sig_id: s1
    sensor: email
    match: { attachment_extension: html, attachment_declared_mime_type_mismatch: true }
    independence_group: g_smuggling
  - sig_id: s2
    sensor: email
    match: { body_instructs_open_attachment_and_click_inside: true }
    independence_group: g_lure_construction

disconfirming_signatures:
  - sig_id: d1
    source: context_store
    match: { asset_ou_in: [SecurityTeam, RedTeam, PentestLab] }
    effect: suppress
    rationale: "Sanctioned attachment-based phishing simulation."
  - sig_id: d2
    source: email
    match: { attachment_content_verified_benign: true }
    effect: penalize
    confidence_penalty: 0.25
    rationale: "The attachment's decoded content was independently verified as a benign local page (e.g. a documented internal tool export), not a credential-harvest form."

required_qualifiers:
  - qualifier_id: q1
    question: "Does the HTML attachment's content, when rendered, present a credential-entry form?"
    resolve_via: edr_process_access_telemetry
    refutes_if: "the rendered content has no form or credential-collection element"
  - qualifier_id: q2
    question: "Was the attachment actually opened by any recipient?"
    resolve_via: email.click_telemetry
    weakens_if: "no recipient opened the attachment"

chain_role: entry
# HTML smuggling has two real, documented payoff paths and this rule's own q1 names both:
# the rendered page either reconstructs a payload locally that the user then runs
# (execution -> command-and-control), or it presents a credential-entry form
# (credential-access). Both are declared rather than picking one, because the message
# evidence alone cannot tell them apart until the attachment is detonated.
expects_downstream:
  - tactic: execution
    within: PT2H
  - tactic: command-and-control
    within: PT4H
  - tactic: credential-access
    within: PT24H
references:
  - https://attack.mitre.org/techniques/T1566/001/
owner: email-detection-eng

# 2026-08-08: recursive_logic added, same bounded-follow-up discipline as
# rule_engine/rules/R-T1566-T1059-001.yaml (the other entry-role phishing rule).
recursive_logic:
  enabled: true
  spawn_on: auto
  max_depth: 1
  max_spawned_investigations: 3
  rationale: >
    Unlike a link-based phish, this lure requires a manual open-and-click on the recipient's
    own machine, so a confirmed match should be followed onto that endpoint: did a process
    actually spawn from the browser/mail client that rendered the smuggled HTML (execution,
    within a couple of hours -- the recipient opens mail on their own schedule but clicks
    the in-page button immediately once they do), did the reconstructed payload then beacon
    out (command-and-control, within four hours of the run), and if the page was instead a
    harvest form, were the entered credentials used (credential-access, within a day). The
    declared-type/extension mismatch that makes this rule fire is an evasion of gateway
    filtering, which means the attachment was never scanned -- so the follow-up hop is the
    only place the real payload behavior becomes visible. chain_role=entry so spawn_on=auto
    resolves to downstream-only (see recursive_planner/planner.py's _auto_direction()).
    Bounded to depth 1 and exactly the 3 declared candidates so this cannot become the
    unbounded per-alert loop specs/07 §9 rejected.
